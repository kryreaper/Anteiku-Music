[project]
name = "anteiku_music"
version = "0.1.0"
description = "An Music Bot for Anteiku Coffee Server."
authors = [
    {name = "Keury", email = "bendyganer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "discord.py~=2.4.0",
    "yt-dlp~=2023.7.6,
    "asyncio",
    "python-dotenv~=0.19.2",
    "spotipy~=2.23.0",
    "pynacl~=1.5.0"
    "ffmpeg-python~=0.2.0"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
